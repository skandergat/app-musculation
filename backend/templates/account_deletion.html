<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppression de compte — LIFTELY</title><link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}"><script defer src="{{ url_for('static', filename='email-actions.js') }}"></script></head><body><main class="wrap"><div class="brand">LIFTELY</div><section class="card"><h1>Demander la suppression du compte</h1><p>Indique l’adresse e-mail du compte. Nous enverrons un lien de confirmation. Le lien expire après 24 heures. Après confirmation, le compte, les séances, les séries et les modèles associés seront supprimés.</p><form data-email-action="delete-request"><div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="actions"><button type="submit">Envoyer le lien de confirmation</button><a class="link" href="/privacy">Politique de confidentialité</a></div><p class="message" role="status" aria-live="polite"></p></form></section></main></body></html>
