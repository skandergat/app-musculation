<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réinitialiser le mot de passe — LIFTELY</title><link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}"><script defer src="{{ url_for('static', filename='email-actions.js') }}"></script></head><body><main class="wrap"><div class="brand">LIFTELY</div><section class="card"><h1>Choisir un nouveau mot de passe</h1><p>Le lien de réinitialisation expire après une heure. Choisis au moins 8 caractères.</p><form data-email-action="reset-password"><div class="field"><label for="password">Nouveau mot de passe</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div><div class="field"><label for="confirm">Confirmer le mot de passe</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div><div class="actions"><button type="submit">Enregistrer le nouveau mot de passe</button></div><p class="message" role="status" aria-live="polite"></p></form></section></main></body></html>
