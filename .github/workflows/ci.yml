name: LIFTELY CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: CI sanity marker
        run: echo "LIFTELY CI sanity check"

      - name: Validate Python syntax
        run: python -m py_compile backend/app.py init_db.py

      - name: Account lifecycle smoke test
        run: python -m backend.account_lifecycle_smoke

      - name: Backend smoke test
        env:
          LIFTELY_DB_PATH: ${{ runner.temp }}/liftely-smoke.db
          LIFTELY_CORS_ORIGINS: https://ci.example.test
        run: |
          python - <<'PY'
          import sqlite3
          from urllib.parse import parse_qs, urlsplit
          from backend import app

          app.app.config["TESTING"] = True

          def token_for(subject, email):
              matches = [
                  item for item in app.app.config["TEST_EMAIL_OUTBOX"]
                  if item["to"] == email and item["subject"] == subject
              ]
              assert matches, (subject, email)
              link = matches[-1]["body"].splitlines()[-1]
              return parse_qs(urlsplit(link).fragment)["token"][0]

          app.assurer_base()
          conn = sqlite3.connect(app.DB_PATH)
          gym = conn.execute(
              "SELECT COUNT(*) FROM exercices WHERE categorie = 'gym' AND actif = 1"
          ).fetchone()[0]
          cal = conn.execute(
              "SELECT COUNT(*) FROM exercices WHERE categorie = 'calisthenics' AND actif = 1"
          ).fetchone()[0]
          assert gym == 185, gym
          assert cal == 152, cal
          conn.close()

          client = app.app.test_client()

          preflight = client.options(
              "/auth/me",
              headers={
                  "Origin": "https://ci.example.test",
                  "Access-Control-Request-Method": "GET",
                  "Access-Control-Request-Headers": "authorization",
              },
          )
          assert preflight.status_code == 200, preflight.data
          assert preflight.headers["Access-Control-Allow-Origin"] == "https://ci.example.test"
          assert "Authorization" in preflight.headers["Access-Control-Allow-Headers"]

          response = client.post(
              "/auth/register",
              json={
                  "nom": "CI Test",
                  "email": "ci-test@example.com",
                  "password": "TestPassword123!"
              },
          )
          assert response.status_code == 201, response.data
          assert "token" not in response.get_json()

          unverified_login = client.post(
              "/auth/login",
              json={"email": "ci-test@example.com", "password": "TestPassword123!"},
          )
          assert unverified_login.status_code == 403, unverified_login.data
          assert unverified_login.get_json()["code"] == "email_not_verified"

          verify_token = token_for(
              "Confirme ton adresse e-mail LIFTELY",
              "ci-test@example.com",
          )
          verified = client.post("/auth/verify-email", json={"token": verify_token})
          assert verified.status_code == 200, verified.data
          assert client.post(
              "/auth/verify-email", json={"token": verify_token}
          ).status_code == 400

          login = client.post(
              "/auth/login",
              json={"email": "ci-test@example.com", "password": "TestPassword123!"},
          )
          assert login.status_code == 200, login.data
          token = login.get_json()["token"]
          headers = {"Authorization": f"Bearer {token}"}

          first_session = client.post("/seances", headers=headers)
          assert first_session.status_code == 201, first_session.data
          first_id = first_session.get_json()["seance_id"]

          second_session = client.post("/seances", headers=headers)
          assert second_session.status_code == 201, second_session.data
          second_id = second_session.get_json()["seance_id"]
          assert second_id != first_id
          assert second_session.get_json()["reused"] is False

          first_id = second_id

          conn = sqlite3.connect(app.DB_PATH)
          exercise_id = conn.execute("SELECT id FROM exercices WHERE actif = 1 ORDER BY id LIMIT 1").fetchone()[0]
          conn.close()

          add_exercise = client.post(
              f"/seances/{first_id}/exercices",
              headers=headers,
              json={"exercice_id": exercise_id},
          )
          assert add_exercise.status_code == 201, add_exercise.data

          reused_session = client.post("/seances", headers=headers)
          assert reused_session.status_code == 200, reused_session.data
          assert reused_session.get_json()["seance_id"] == first_id
          assert reused_session.get_json()["reused"] is True

          duplicate_exercise = client.post(
              f"/seances/{first_id}/exercices",
              headers=headers,
              json={"exercice_id": exercise_id},
          )
          assert duplicate_exercise.status_code == 409, duplicate_exercise.data

          series = client.post(
              f"/seances/{first_id}/series",
              headers=headers,
              json={"exercice_id": exercise_id, "poids": 20, "repetitions": 10},
          )
          assert series.status_code == 201, series.data

          active = client.get("/seances/active", headers=headers)
          assert active.status_code == 200, active.data
          active_data = active.get_json()
          assert any(
              e["exercice_id"] == exercise_id
              for e in active_data["seance"]["exercices"]
          )

          invalid_nan = client.post(
              f"/seances/{first_id}/series",
              headers=headers,
              json={"exercice_id": exercise_id, "poids": "NaN", "repetitions": 10},
          )
          assert invalid_nan.status_code == 400, invalid_nan.data

          invalid_weight = client.post(
              f"/seances/{first_id}/series",
              headers=headers,
              json={"exercice_id": exercise_id, "poids": 1001, "repetitions": 10},
          )
          assert invalid_weight.status_code == 400, invalid_weight.data

          finished = client.post(
              f"/seances/{first_id}/terminer",
              headers=headers,
          )
          assert finished.status_code == 200, finished.data

          history = client.get("/historique", headers=headers)
          assert history.status_code == 200, history.data
          assert len(history.get_json()) == 1

          progression = client.get("/progression", headers=headers)
          assert progression.status_code == 200, progression.data
          progression_data = progression.get_json()
          assert len(progression_data) == 1, progression_data
          assert progression_data[0]["meilleur_poids"] == 20
          assert progression_data[0]["meilleures_repetitions"] == 10
          assert progression_data[0]["volume_total"] == 200

          template = client.post(
              "/templates",
              headers=headers,
              json={"nom": "CI Push A"},
          )
          assert template.status_code == 201, template.data
          template_id = template.get_json()["id"]

          template_add = client.post(
              f"/templates/{template_id}/exercices",
              headers=headers,
              json={"exercice_id": exercise_id},
          )
          assert template_add.status_code == 201, template_add.data

          template_add_decimal = client.post(
              f"/templates/{template_id}/exercices",
              headers=headers,
              json={"exercice_id": 1.5},
          )
          assert template_add_decimal.status_code == 400, template_add_decimal.data

          template_detail = client.get(
              f"/templates/{template_id}",
              headers=headers,
          )
          assert template_detail.status_code == 200, template_detail.data
          assert [e["exercice_id"] for e in template_detail.get_json()["exercices"]] == [exercise_id]

          template_start = client.post(
              f"/templates/{template_id}/start",
              headers=headers,
          )
          assert template_start.status_code == 201, template_start.data
          template_session_id = template_start.get_json()["seance_id"]

          template_active = client.get("/seances/active", headers=headers)
          assert template_active.status_code == 200, template_active.data
          assert [e["exercice_id"] for e in template_active.get_json()["seance"]["exercices"]] == [exercise_id]

          template_series = client.post(
              f"/seances/{template_session_id}/series",
              headers=headers,
              json={"exercice_id": exercise_id, "poids": 25, "repetitions": 8},
          )
          assert template_series.status_code == 201, template_series.data
          template_series_id = template_series.get_json()["series_id"]

          template_update = client.put(
              f"/seances/{template_session_id}/series/{template_series_id}",
              headers=headers,
              json={"exercice_id": exercise_id, "poids": 27.5, "repetitions": 9},
          )
          assert template_update.status_code == 200, template_update.data

          template_active_after_update = client.get(
              "/seances/active",
              headers=headers,
          )
          assert template_active_after_update.status_code == 200, template_active_after_update.data
          updated_series = [
              item
              for item in template_active_after_update.get_json()["seance"]["series"]
              if item["id"] == template_series_id
          ]
          assert len(updated_series) == 1, updated_series
          assert updated_series[0]["poids"] == 27.5
          assert updated_series[0]["repetitions"] == 9

          template_finished = client.post(
              f"/seances/{template_session_id}/terminer",
              headers=headers,
          )
          assert template_finished.status_code == 200, template_finished.data

          template_after_workout = client.get(
              f"/templates/{template_id}",
              headers=headers,
          )
          assert template_after_workout.status_code == 200, template_after_workout.data
          assert [e["exercice_id"] for e in template_after_workout.get_json()["exercices"]] == [exercise_id]

          history_after_template = client.get("/historique", headers=headers)
          assert history_after_template.status_code == 200, history_after_template.data
          assert len(history_after_template.get_json()) == 2

          progression_after_template = client.get("/progression", headers=headers)
          assert progression_after_template.status_code == 200, progression_after_template.data
          progression_after_template_data = progression_after_template.get_json()
          assert len(progression_after_template_data) == 1, progression_after_template_data
          assert progression_after_template_data[0]["meilleur_poids"] == 27.5
          assert progression_after_template_data[0]["meilleures_repetitions"] == 10
          assert progression_after_template_data[0]["volume_total"] == 447.5

          rejected = client.post(
              f"/seances/{first_id}/series",
              headers=headers,
              json={"exercice_id": exercise_id, "poids": 20, "repetitions": 10},
          )
          assert rejected.status_code == 404, rejected.data

          wrong_delete_password = client.delete(
              "/auth/account",
              headers=headers,
              json={"password": "WrongPassword123!"},
          )
          assert wrong_delete_password.status_code == 403, wrong_delete_password.data

          account_deleted = client.delete(
              "/auth/account",
              headers=headers,
              json={"password": "TestPassword123!"},
          )
          assert account_deleted.status_code == 200, account_deleted.data

          conn = sqlite3.connect(app.DB_PATH)
          assert conn.execute("SELECT COUNT(*) FROM users").fetchone()[0] == 0
          for table in ("sessions", "seances", "seance_exercices", "series", "templates", "template_exercices", "auth_action_tokens"):
              assert conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0] == 0, table
          email_limit_hash = app.hash_token("email:ci-test@example.com")
          assert conn.execute(
              "SELECT COUNT(*) FROM auth_mail_limits WHERE key_hash = ?",
              (email_limit_hash,),
          ).fetchone()[0] == 0
          conn.close()

          print("LIFTELY backend smoke test: OK")
          PY

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: ESLint
        working-directory: mobile
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Export web production bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: npx expo export --platform web

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor
