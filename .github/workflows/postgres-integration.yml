name: LIFTELY PostgreSQL integration

on:
  pull_request:
  push:
    branches:
      - fix/postgres-consolidation

permissions:
  contents: read

jobs:
  postgres-adapter:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liftely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LIFTELY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/liftely_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Provision isolated PostgreSQL schema
        run: psql "$LIFTELY_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/postgres_schema.sql
      - name: Compile backend and migration scripts
        run: python -m py_compile backend/app.py backend/db_compat.py backend/migrate_sqlite_to_postgres.py
      - name: Unit-test read-only migration preflight
        run: python -m unittest backend.test_migration_preflight
      - name: Test PostgreSQL adapter against real PostgreSQL
        run: python -m backend.postgres_integration_smoke
