# Bootstrap run after permission-safe workflow update.
name: LIFTELY mobile dependency maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 * *"
  push:
    branches:
      - chore/mobile-sdk57-dependency-refresh
    paths:
      - .github/workflows/mobile-dependency-maintenance.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install current locked dependencies
        working-directory: mobile
        run: npm ci
      - name: Apply compatible npm security updates (never force)
        working-directory: mobile
        run: npm audit fix --no-fund || true
      - name: Align Expo SDK dependencies and install EAS dev client
        working-directory: mobile
        run: |
          npx expo install --fix
          npx expo install expo-dev-client
          ROUTER_VERSION=$(node -p "require('./node_modules/expo-router/package.json').version")
          CURRENT_PATCH=$(find patches -maxdepth 1 -name 'expo-router+*.patch' -print -quit)
          TARGET_PATCH="patches/expo-router+${ROUTER_VERSION}.patch"
          if [ -n "$CURRENT_PATCH" ] && [ "$CURRENT_PATCH" != "$TARGET_PATCH" ]; then
            cp "$CURRENT_PATCH" "$TARGET_PATCH"
            rm "$CURRENT_PATCH"
          fi
          npm install --no-audit --no-fund
      - name: Reproducible clean install
        working-directory: mobile
        run: npm ci
      - name: Push dependency candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/automated-mobile-dependency-refresh
          git add mobile/package.json mobile/package-lock.json mobile/patches
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "chore(mobile): refresh Expo SDK 57 dependencies"
          git push origin HEAD:refs/heads/chore/automated-mobile-dependency-refresh --force
          echo "Candidate branch: https://github.com/skandergat/app-musculation/compare/main...chore/automated-mobile-dependency-refresh?expand=1" >> "$GITHUB_STEP_SUMMARY"
      - name: Translation parity
        working-directory: mobile
        run: npm run check:translations
      - name: Lint
        working-directory: mobile
        run: npm run lint
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Web production export
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: npx expo export --platform web
      - name: npm audit summary
        working-directory: mobile
        run: |
          npm audit --json > audit-report.json || true
          node scripts/audit-summary.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          const v = r.metadata?.vulnerabilities || {};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### npm audit\n\n' + JSON.stringify(v, null, 2) + '\n');
          NODE
